<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Agent Factory</title>
  <style>
    :root { --bg:#0f1115; --card:#181b22; --line:#262b36; --text:#e7e9ee; --muted:#9aa3b2; --accent:#5b8cff; --err:#ff6b6b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center;
           background:var(--bg); color:var(--text);
           font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
    .card { width:100%; max-width:380px; padding:32px; background:var(--card);
            border:1px solid var(--line); border-radius:12px; }
    h1 { margin:0 0 4px; font-size:20px; }
    p.sub { margin:0 0 24px; color:var(--muted); font-size:14px; }
    label { display:block; margin:16px 0 6px; font-size:13px; color:var(--muted); }
    input { width:100%; padding:10px 12px; background:#0f1115; color:var(--text);
            border:1px solid var(--line); border-radius:8px; font-size:15px; }
    input:focus { outline:none; border-color:var(--accent); }
    button { width:100%; margin-top:24px; padding:11px; background:var(--accent);
             color:#fff; border:0; border-radius:8px; font-size:15px; font-weight:500;
             cursor:pointer; }
    button:disabled { opacity:.6; cursor:default; }
    .msg { margin-top:16px; padding:10px 12px; border-radius:8px; font-size:14px; display:none; }
    .msg.error { display:block; background:rgba(255,107,107,.12); color:var(--err); }
    .msg.info { display:block; background:rgba(91,140,255,.12); color:var(--accent); }
    .foot { margin-top:20px; text-align:center; font-size:14px; color:var(--muted); }
    .foot a { color:var(--accent); text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign in</h1>
    <p class="sub">Agent Factory</p>

    <div id="msg" class="msg"></div>

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" autofocus>

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">

    <button id="submit">Sign in</button>

    <p class="foot">No account? <a href="/register">Register an organisation</a></p>
  </div>

  <script src="/static/js/auth.js"></script>
  <script>
    const msg = document.getElementById("msg");
    const btn = document.getElementById("submit");

    function show(text, kind) {
      msg.textContent = text;
      msg.className = "msg " + kind;
    }

    if (new URLSearchParams(location.search).get("expired")) {
      show("Your session expired. Please sign in again.", "info");
    }

    async function doLogin() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!email || !password) {
        show("Enter your email and password.", "error");
        return;
      }
      btn.disabled = true;
      show("Signing in…", "info");
      try {
        await Auth.login(email, password);
        window.location.href = "/";
      } catch (e) {
        show(e.message, "error");
        btn.disabled = false;
      }
    }

    btn.addEventListener("click", doLogin);
    document.querySelectorAll("input").forEach(i =>
      i.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); })
    );
  </script>
</body>
</html>
