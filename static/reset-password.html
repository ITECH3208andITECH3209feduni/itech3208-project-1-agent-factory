<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password — Agent Factory</title>
  <style>
    :root { --bg:#0f1115; --card:#181b22; --line:#262b36; --text:#e7e9ee; --muted:#9aa3b2; --accent:#5b8cff; --err:#ff6b6b; --ok:#4ade80; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center;
           background:var(--bg); color:var(--text);
           font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
    .card { width:100%; max-width:380px; padding:32px; background:var(--card);
            border:1px solid var(--line); border-radius:12px; }
    h1 { margin:0 0 4px; font-size:20px; }
    p.sub { margin:0 0 24px; color:var(--muted); font-size:14px; }
    label { display:block; margin:16px 0 6px; font-size:13px; color:var(--muted); }
    input { width:100%; padding:10px 12px; background:#0f1115; color:var(--text);
            border:1px solid var(--line); border-radius:8px; font-size:15px; }
    input:focus { outline:none; border-color:var(--accent); }
    .hint { margin-top:6px; font-size:12px; color:var(--muted); }
    button { width:100%; margin-top:24px; padding:11px; background:var(--accent);
             color:#fff; border:0; border-radius:8px; font-size:15px; font-weight:500;
             cursor:pointer; }
    button:disabled { opacity:.6; cursor:default; }
    .msg { margin-top:16px; padding:10px 12px; border-radius:8px; font-size:14px; display:none; }
    .msg.error { display:block; background:rgba(255,107,107,.12); color:var(--err); }
    .msg.info { display:block; background:rgba(91,140,255,.12); color:var(--accent); }
    .msg.ok { display:block; background:rgba(74,222,128,.12); color:var(--ok); }
    .foot { margin-top:20px; text-align:center; font-size:14px; color:var(--muted); }
    .foot a { color:var(--accent); text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Choose a new password</h1>
    <p class="sub">Agent Factory</p>

    <div id="msg" class="msg"></div>

    <div id="form">
      <label for="pw1">New password</label>
      <input id="pw1" type="password" autocomplete="new-password" autofocus>
      <div class="hint">At least 8 characters.</div>

      <label for="pw2">Confirm password</label>
      <input id="pw2" type="password" autocomplete="new-password">

      <button id="submit">Update password</button>
    </div>

    <p class="foot"><a href="/login">Back to sign in</a></p>
  </div>

  <script>
    const msg = document.getElementById("msg");
    const btn = document.getElementById("submit");
    const form = document.getElementById("form");
    const token = new URLSearchParams(location.search).get("token");

    function show(text, kind) {
      msg.textContent = text;
      msg.className = "msg " + kind;
    }

    if (!token) {
      show("This reset link is missing its token. Request a new one from the sign-in page.", "error");
      form.style.display = "none";
    }

    async function doReset() {
      const pw1 = document.getElementById("pw1").value;
      const pw2 = document.getElementById("pw2").value;

      if (pw1.length < 8) { show("Password must be at least 8 characters.", "error"); return; }
      if (pw1 !== pw2)    { show("The two passwords don't match.", "error"); return; }

      btn.disabled = true;
      show("Updating…", "info");
      try {
        const res = await fetch("/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, new_password: pw1 }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || "Reset failed");
        }
        show("Password updated. Redirecting to sign in…", "ok");
        form.style.display = "none";
        setTimeout(() => { window.location.href = "/login"; }, 1800);
      } catch (e) {
        show(e.message, "error");
        btn.disabled = false;
      }
    }

    btn.addEventListener("click", doReset);
    document.querySelectorAll("input").forEach(i =>
      i.addEventListener("keydown", e => { if (e.key === "Enter") doReset(); })
    );
  </script>
</body>
</html>
