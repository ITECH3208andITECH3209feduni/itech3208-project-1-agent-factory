<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — Agent Factory</title>
  <style>
    :root { --bg:#0f1115; --card:#181b22; --line:#262b36; --text:#e7e9ee; --muted:#9aa3b2; --accent:#5b8cff; --err:#ff6b6b; --ok:#4ade80; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center;
           background:var(--bg); color:var(--text);
           font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
    .card { width:100%; max-width:380px; padding:32px; background:var(--card);
            border:1px solid var(--line); border-radius:12px; }
    h1 { margin:0 0 4px; font-size:20px; }
    p.sub { margin:0 0 24px; color:var(--muted); font-size:14px; }
    label { display:block; margin:16px 0 6px; font-size:13px; color:var(--muted); }
    input { width:100%; padding:10px 12px; background:#0f1115; color:var(--text);
            border:1px solid var(--line); border-radius:8px; font-size:15px; }
    input:focus { outline:none; border-color:var(--accent); }
    .hint { margin-top:6px; font-size:12px; color:var(--muted); }
    button { width:100%; margin-top:24px; padding:11px; background:var(--accent);
             color:#fff; border:0; border-radius:8px; font-size:15px; font-weight:500;
             cursor:pointer; }
    button:disabled { opacity:.6; cursor:default; }
    .msg { margin-top:16px; padding:10px 12px; border-radius:8px; font-size:14px; display:none; }
    .msg.error { display:block; background:rgba(255,107,107,.12); color:var(--err); }
    .msg.info { display:block; background:rgba(91,140,255,.12); color:var(--accent); }
    .msg.ok { display:block; background:rgba(74,222,128,.12); color:var(--ok); }
    .foot { margin-top:20px; text-align:center; font-size:14px; color:var(--muted); }
    .foot a { color:var(--accent); text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Register an organisation</h1>
    <p class="sub">You'll be the owner of this organisation.</p>

    <div id="msg" class="msg"></div>

    <label for="org">Organisation name</label>
    <input id="org" type="text" autofocus>

    <label for="email">Your email</label>
    <input id="email" type="email" autocomplete="username">

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="new-password">
    <div class="hint">At least 8 characters.</div>

    <button id="submit">Create organisation</button>

    <p class="foot">Already registered? <a href="/login">Sign in</a></p>
  </div>

  <script src="/static/js/auth.js"></script>
  <script>
    const msg = document.getElementById("msg");
    const btn = document.getElementById("submit");

    function show(text, kind) {
      msg.textContent = text;
      msg.className = "msg " + kind;
    }

    async function doRegister() {
      const orgName = document.getElementById("org").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!orgName || !email || !password) {
        show("Fill in all three fields.", "error");
        return;
      }
      if (password.length < 8) {
        show("Password must be at least 8 characters.", "error");
        return;
      }

      btn.disabled = true;
      show("Creating organisation…", "info");
      try {
        await Auth.register(orgName, email, password);
        // Registration doesn't return tokens, so sign in straight after.
        await Auth.login(email, password);
        show("Done. Redirecting…", "ok");
        window.location.href = "/";
      } catch (e) {
        show(e.message, "error");
        btn.disabled = false;
      }
    }

    btn.addEventListener("click", doRegister);
    document.querySelectorAll("input").forEach(i =>
      i.addEventListener("keydown", e => { if (e.key === "Enter") doRegister(); })
    );
  </script>
</body>
</html>
