name: CI

# Runs on master AND main. The repo's remote HEAD is `main` but all team work
# lands on `master`, and the previous version of this file only listened for
# PRs to `main` — so CI silently never ran on a single team PR (PROJ-452).
# Listening to both means it runs regardless of which branch you target, and
# keeps working if the default branch is ever consolidated.
on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Python: the Agent Factory application ────────────────────
  # This is the job that matters for the Python app and was entirely absent
  # before: 208 checks existed in scripts/test_*.py and none of them ran in CI.
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate environment config loads
        # No secrets in CI, so validate_env() will report missing keys. That is
        # expected and must not fail the build — we assert it *loads*, since an
        # import-time crash in settings.py breaks everything downstream.
        run: python -c "from config.settings import validate_env; print('\n'.join(validate_env()) or 'all set')"

      - name: Run test suites
        # Every suite runs even if an earlier one fails, so one red suite does
        # not hide the state of the others.
        run: |
          rc=0
          for suite in scripts/test_*.py; do
            echo "::group::$suite"
            python "$suite" || rc=1
            echo "::endgroup::"
          done
          exit $rc

      - name: MCP stdio smoke test
        run: python scripts/smoke_mcp_stdio.py

  # ── Secrets audit ────────────────────────────────────────────
  secrets:
    name: Secrets audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the audit scans every commit, and the default
          # shallow clone would make it pass vacuously.
          fetch-depth: 0

      - name: Audit repository history for credentials
        run: |
          chmod +x scripts/audit_secrets.sh
          ./scripts/audit_secrets.sh

  # ── Node: the NanoClaw side ──────────────────────────────────
  # Kept as it was, apart from the branch fix. Marked continue-on-error
  # because it has never actually run against this branch, so its true state
  # is unknown — making it blocking today could wedge every PR on a
  # pre-existing failure nobody has seen yet. Remove continue-on-error once
  # it is confirmed green.
  node:
    name: Node checks (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

  python-tests:
    # PROJ-374-378: Python side (Agent Factory research assistant +
    # AI Receptionist) test coverage — separate job from the Node/TS
    # NanoClaw side above so either can fail independently and both
    # show up as distinct PR checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements_web.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest --cov=agent --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml

      - name: Coverage summary badge (PROJ-374-378)
        # Stdlib-only, no third-party badge service and no repo-write-back
        # (Dilraj's GitHub account has had real collaborator-permission
        # issues on this repo — see PR #14's history — so this
        # deliberately avoids any step that needs push access). Reads the
        # line-rate straight out of coverage.xml and renders it as a
        # colored line in the PR's Checks summary, which is visible
        # without downloading the artifact.
        if: always()
        run: |
          cat > /tmp/coverage_summary.py <<'PY'
          import xml.etree.ElementTree as ET
          import os

          try:
              root = ET.parse("coverage.xml").getroot()
              pct = round(float(root.attrib["line-rate"]) * 100, 1)
          except Exception as exc:
              pct = None
              print(f"Could not parse coverage.xml: {exc}")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if pct is not None:
              color = "brightgreen" if pct >= 80 else "yellow" if pct >= 60 else "red"
              line = f"**Python coverage: {pct}%** ({color})"
          else:
              line = "**Python coverage: unavailable** (see logs)"

          print(line)
          if summary_path:
              with open(summary_path, "a") as fh:
                  fh.write(line + "\n")
          PY
          python3 /tmp/coverage_summary.py

  docker-smoke-test:
    # PROJ-374-378: builds the Web UI's app/web_ui/Dockerfile and
    # confirms the container actually starts and answers a real HTTP
    # request — not just that `docker build` succeeds. This is the
    # "deployable app" half of CI/CD; the Node/TS and pytest jobs
    # above only prove the source is correct, not that the packaged
    # artifact runs.
    #
    # Scope note: no Dapr stage exists here because there is no Dapr
    # anywhere in this codebase to test against (see the Dockerfile's
    # header comment). Adding one would mean inventing infrastructure
    # the app doesn't use, not verifying something real.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f app/web_ui/Dockerfile -t agent-factory-web:ci .

      - name: Run container
        run: |
          docker run -d --name web-smoke -p 8000:8000 agent-factory-web:ci
          echo "Waiting for the app to come up..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/status; then
              echo "Container is up."
              exit 0
            fi
            sleep 1
          done
          echo "Container never became healthy — dumping logs:"
          docker logs web-smoke
          exit 1

      - name: Smoke-test /status
        run: |
          curl -sf http://localhost:8000/status | tee /dev/stderr | grep -q '"status":"ok"'

      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs web-smoke || true

      - name: Stop container
        if: always()
        run: docker rm -f web-smoke || true
