name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ────────────────────────────────────────────────────────────
  # JS / TS side: formatting, typecheck, vitest
  # ────────────────────────────────────────────────────────────
  ci:
    name: JS / TS checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

  # ────────────────────────────────────────────────────────────
  # Python side: pytest on multiple Python versions
  # Added in PROJ-105.
  # ────────────────────────────────────────────────────────────
  pytest:
    name: Python pytest
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run pytest
        run: |
          if [ -d "tests" ] && [ -n "$(ls -A tests 2>/dev/null | grep -v __pycache__)" ]; then
            python -m pytest tests/ -v
          else
            echo "No tests directory or empty — skipping pytest."
          fi